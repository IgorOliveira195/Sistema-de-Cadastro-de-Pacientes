services:
  app:
    build: ./backend
    container_name: conectasus-app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      APP_URL: http://localhost:8080

  nginx:
    image: nginx:alpine
    container_name: conectasus-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/var/www/public/spa
    depends_on:
      app:
        condition: service_started
      frontend:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: conectasus-db
    restart: unless-stopped
    environment:
      # Mesmos valores do backend/.env.example
      MYSQL_DATABASE: conectasus
      MYSQL_USER: conectasus
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: conectasus-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VUE_APP_API_URL: /api
    command: sh -c "npm install && tail -f /dev/null"

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:
